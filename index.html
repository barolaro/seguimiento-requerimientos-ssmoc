<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seguimiento de Requerimientos - SSMOC</title>
<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f6f9;
}
.login{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#0d4b75,#1e6fa5);
}
.card{
    width:430px;
    background:white;
    border-radius:20px;
    padding:35px;
    box-shadow:0 20px 60px rgba(0,0,0,.25);
}
.logo{
    display:block;
    width:180px;
    margin:0 auto 20px;
}
h1{
    margin:0;
    text-align:center;
    color:#143d59;
}
h3{
    margin:8px 0 25px;
    text-align:center;
    color:#5c6b7a;
    font-weight:normal;
}
label{
    display:block;
    margin:12px 0 6px;
    font-weight:bold;
}
input{
    width:100%;
    padding:12px;
    border:1px solid #d8dee5;
    border-radius:8px;
    box-sizing:border-box;
}
button{
    width:100%;
    margin-top:20px;
    padding:12px;
    border:0;
    border-radius:8px;
    background:#1e6fa5;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}
.credit{
    margin-top:22px;
    text-align:center;
    color:#6b7280;
    font-size:13px;
}
</style>
</head>
<body>
<div class="login">
<div class="card">
<img src="assets/logo_ssmoc.png" class="logo" alt="Logo SSMOC">
<h1>Seguimiento de Requerimientos</h1>
<h3>Departamento de Abastecimiento<br>Servicio de Salud Metropolitano Occidente</h3>
<label>Usuario</label>
<input placeholder="Ingrese su usuario">
<label>Contraseña</label>
<input type="password" placeholder="********">
<button>Ingresar</button>
<div class="credit">Desarrollado por Bayron Retamal Gonzalez</div>
</div>
</div>
</body>
</html>
