<style>
:root{--v3-navy:#082f55;--v3-blue:#0877c9;--v3-bg:#f4f7fb;--v3-muted:#6b7c90;--v3-line:#dfe7ef;--v3-shadow:0 12px 34px rgba(19,54,88,.12)}
body{background:var(--v3-bg)!important}.app{display:block;min-height:100vh}.app.hidden,.login.hidden{display:none!important}.sidebar{display:none!important}.main{padding:94px clamp(18px,3vw,40px) 48px!important;max-width:1560px;margin:auto!important}.header-actions{display:none!important}
.v3-topbar{position:fixed;inset:0 0 auto;z-index:80;height:72px;display:grid;grid-template-columns:minmax(250px,330px) minmax(0,1fr) auto;align-items:center;gap:14px;padding:0 clamp(16px,2.4vw,34px);background:rgba(255,255,255,.97);backdrop-filter:blur(16px);border-bottom:1px solid var(--v3-line);box-shadow:0 6px 24px rgba(19,54,88,.06)}
.v3-brand{display:flex;align-items:center;gap:11px}.v3-brand-logo{width:44px;height:44px;object-fit:cover;border-radius:10px;border:1px solid var(--v3-line)}.v3-brand-title{font-size:14px;font-weight:900;line-height:1.08;color:var(--v3-navy)}.v3-brand-sub{font-size:9px;color:var(--v3-muted);margin-top:3px}.v3-nav{display:flex;justify-content:center;gap:2px;overflow:hidden}.v3-nav button{border:0;background:transparent;color:#53657a;border-radius:9px;padding:9px;font-size:11px;font-weight:800;white-space:nowrap}.v3-nav button:hover,.v3-nav button.active{background:#e6f3fc;color:var(--v3-blue)}
.v3-user{display:flex;align-items:center;gap:9px;position:relative}.v3-alert,.v3-profile-trigger,.v3-mobile-toggle{border:1px solid var(--v3-line);background:#fff;border-radius:11px;color:var(--v3-navy)}.v3-alert{position:relative;padding:9px 11px}.v3-alert-count{position:absolute;right:-5px;top:-6px;background:#ed1c2e;color:#fff;border-radius:99px;min-width:19px;height:19px;display:grid;place-items:center;font-size:10px;font-weight:900}.v3-profile-trigger{display:flex;align-items:center;gap:9px;padding:6px 9px;cursor:pointer}.v3-avatar{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--v3-blue),#3346b7);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:900}.v3-user-name{font-size:11px;font-weight:900;max-width:160px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.v3-user-role{font-size:9px;color:var(--v3-muted)}.v3-chevron{font-size:10px;color:#6b7c90}.v3-dropdown{display:none;position:absolute;right:0;top:54px;width:280px;background:#fff;border:1px solid var(--v3-line);border-radius:15px;box-shadow:var(--v3-shadow);padding:8px;z-index:120}.v3-dropdown.open{display:block}.v3-dropdown-head{padding:12px;border-bottom:1px solid #e8eef4;margin-bottom:6px}.v3-dropdown-head b{display:block;color:var(--v3-navy);font-size:13px}.v3-dropdown-head span{font-size:10px;color:var(--v3-muted)}.v3-dropdown button{width:100%;border:0;background:transparent;border-radius:9px;padding:10px 11px;text-align:left;color:#31465d;font-size:12px;font-weight:700}.v3-dropdown button:hover{background:#f1f7fc}.v3-dropdown .logout{color:#c62835;border-top:1px solid #e8eef4;margin-top:5px}.v3-alert-panel{display:none;position:absolute;right:220px;top:54px;width:340px;background:#fff;border:1px solid var(--v3-line);border-radius:15px;box-shadow:var(--v3-shadow);padding:10px;z-index:120}.v3-alert-panel.open{display:block}.v3-alert-item{padding:10px;border-radius:10px;background:#f7f9fc;margin-bottom:7px;font-size:11px}.v3-alert-item b{display:block;font-size:12px;color:var(--v3-navy)}.v3-mobile-toggle{display:none;padding:9px 11px}.v3-mobile-menu{display:none;position:fixed;top:72px;left:12px;right:12px;z-index:79;background:#fff;border:1px solid var(--v3-line);border-radius:15px;padding:10px;box-shadow:var(--v3-shadow)}.v3-mobile-menu.open{display:grid;grid-template-columns:1fr 1fr;gap:6px}.v3-mobile-menu button{border:0;background:#f5f8fb;border-radius:9px;padding:11px;text-align:left;font-size:12px;font-weight:800}.v3-credit{position:fixed;right:18px;bottom:14px;z-index:30;background:#fff;border:1px solid var(--v3-line);border-radius:99px;padding:7px 11px;font-size:10px;color:var(--v3-muted);box-shadow:0 6px 18px rgba(19,54,88,.08)}.v3-credit strong{color:var(--v3-navy)}
@media(max-width:1050px){.v3-nav{display:none}.v3-mobile-toggle{display:block}.v3-topbar{grid-template-columns:1fr auto}.v3-user-copy{display:none}.v3-alert-panel{right:62px}}
@media(max-width:720px){.v3-topbar{height:64px;padding:0 12px}.main{padding:82px 12px 34px!important}.v3-brand-sub{display:none}.v3-brand-logo{width:36px;height:36px}.v3-dropdown{right:0;top:50px;width:min(280px,calc(100vw - 24px))}.v3-alert-panel{right:0;top:50px;width:min(340px,calc(100vw - 24px))}.v3-mobile-menu{top:64px}.v3-credit{position:static;margin:15px auto;width:max-content}}
</style>
<script>
(function(){
 const AUTHOR='Bayron Retamal González';
 function navItems(){const a=[['dashboard','Panel','◉'],['requirements','Requerimientos','▣'],['trace','Trazabilidad','◷'],['alerts','Alertas','♢']];if(isManager()){a.splice(2,0,['team','Equipo','♙']);a.push(['reports','Reportes','▥'],['indicators','Indicadores','⌁'])}if(current?.r==='Administrador')a.push(['userAdministration','Administración','⚙']);return a}
 function activate(id){document.querySelectorAll('.v3-nav button,.v3-mobile-menu button').forEach(b=>b.classList.toggle('active',b.dataset.section===id))}
 function go(id){const original=document.querySelector(`.nav button[onclick*="'${id}'"]`);show(id,original||undefined);activate(id);closeMenus()}window.v3Go=go;
 function closeMenus(){document.querySelectorAll('.v3-dropdown,.v3-alert-panel,.v3-mobile-menu').forEach(x=>x.classList.remove('open'))}
 function renderNav(el){el.innerHTML=navItems().map(([id,l,i])=>`<button data-section="${id}" onclick="v3Go('${id}')">${i} ${l}</button>`).join('')}
 function alertItems(){const list=visible().filter(x=>x.alerts?.[current.u]);return list.length?list.slice(0,4).map(x=>`<div class="v3-alert-item"><b>REQ-${String(x.id).padStart(3,'0')} · ${x.t}</b>${x.estado} · ${x.prio}</div>`).join(''):'<div class="v3-alert-item">No hay alertas pendientes.</div>'}
 function install(){if(!current||document.getElementById('v3Topbar'))return;const app=document.getElementById('app');const bar=document.createElement('header');bar.id='v3Topbar';bar.className='v3-topbar';bar.innerHTML=`<div class="v3-brand"><img class="v3-brand-logo" src="https://gestordocumentalhsjd.ceropapel.cl/archivos/publico//logos/logo3.jpg"><div><div class="v3-brand-title">Gestión y Trazabilidad<br>para Compras Públicas</div><div class="v3-brand-sub">Departamento de Abastecimiento · SSMOCC</div></div></div><nav id="v3Nav" class="v3-nav"></nav><div class="v3-user"><button class="v3-mobile-toggle" onclick="document.getElementById('v3MobileMenu').classList.toggle('open')">☰</button><button class="v3-alert" onclick="toggleAlerts(event)">🔔<span id="v3AlertCount" class="v3-alert-count">0</span></button><button class="v3-profile-trigger" onclick="toggleProfile(event)"><div class="v3-avatar">${current.i}</div><div class="v3-user-copy"><div class="v3-user-name">${current.n}</div><div class="v3-user-role">${current.r}</div></div><span class="v3-chevron">▼</span></button><div id="v3ProfileMenu" class="v3-dropdown"><div class="v3-dropdown-head"><b>${current.n}</b><span>${current.r}<br>Último acceso: ${new Date().toLocaleString('es-CL')}</span></div><button onclick="alert('Perfil de usuario: ${current.n}')">👤 Mi perfil</button><button onclick="alert('Cambio de contraseña disponible desde Administración.')">🔑 Cambiar contraseña</button>${current.r==='Administrador'?'<button onclick="v3Go(\'userAdministration\')">⚙ Administración de usuarios</button>':''}<button class="logout" onclick="location.reload()">🚪 Cerrar sesión</button></div><div id="v3AlertPanel" class="v3-alert-panel"><b style="display:block;padding:5px 4px 10px;color:#082f55">Alertas recientes</b><div id="v3AlertItems"></div><button style="width:100%;border:0;background:#eaf3fb;color:#0877c9;border-radius:9px;padding:9px;font-weight:800" onclick="v3Go('alerts')">Ver todas las alertas</button></div></div>`;app.prepend(bar);const mobile=document.createElement('div');mobile.id='v3MobileMenu';mobile.className='v3-mobile-menu';document.body.appendChild(mobile);renderNav(v3Nav);renderNav(mobile);const credit=document.createElement('div');credit.className='v3-credit';credit.innerHTML=`Diseñado y desarrollado por <strong>${AUTHOR}</strong>`;document.body.appendChild(credit);activate('dashboard');update()}
 window.toggleProfile=function(e){e.stopPropagation();v3AlertPanel?.classList.remove('open');v3ProfileMenu.classList.toggle('open')};window.toggleAlerts=function(e){e.stopPropagation();v3ProfileMenu?.classList.remove('open');v3AlertPanel.classList.toggle('open')};
 function update(){const c=visible().filter(x=>x.alerts?.[current.u]).length;if(window.v3AlertCount){v3AlertCount.textContent=c;v3AlertCount.style.display=c?'grid':'none'}if(window.v3AlertItems)v3AlertItems.innerHTML=alertItems()}
 document.addEventListener('click',closeMenus);const l=window.login;window.login=function(){l();setTimeout(install,0)};const r=window.renderAll;window.renderAll=function(){r();update()};const s=window.show;window.show=function(id,b){s(id,b);activate(id)};
})();
</script>
