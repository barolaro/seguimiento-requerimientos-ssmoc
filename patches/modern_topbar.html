<style>
/* ===== TEMA EJECUTIVO V3 — inspirado en Baro.html ===== */
:root{
  --v3-navy:#082f55;
  --v3-blue:#0877c9;
  --v3-sky:#0ea5e9;
  --v3-bg:#f4f7fb;
  --v3-card:#ffffff;
  --v3-text:#142b48;
  --v3-muted:#6b7c90;
  --v3-line:#dfe7ef;
  --v3-shadow:0 12px 34px rgba(19,54,88,.08);
}

body{background:var(--v3-bg)!important;color:var(--v3-text)!important}
.app{display:block!important;min-height:100vh;background:var(--v3-bg)!important}
.sidebar{display:none!important}
.main{padding:96px clamp(18px,3vw,42px) 44px!important;max-width:1500px;margin:0 auto!important;width:100%!important}

.v3-topbar{
  position:fixed;top:0;left:0;right:0;z-index:80;height:72px;
  display:flex;align-items:center;justify-content:space-between;gap:18px;
  padding:0 clamp(18px,3vw,42px);
  background:rgba(255,255,255,.94);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid var(--v3-line);
  box-shadow:0 6px 24px rgba(19,54,88,.06)
}
.v3-brand{display:flex;align-items:center;gap:11px;min-width:250px}
.v3-brand-logo{width:42px;height:42px;object-fit:cover;border-radius:10px;border:1px solid var(--v3-line)}
.v3-brand-title{font-size:15px;font-weight:900;line-height:1.08;color:var(--v3-navy)}
.v3-brand-sub{font-size:10px;color:var(--v3-muted);margin-top:3px}
.v3-nav{display:flex;align-items:center;gap:4px;flex:1;justify-content:center}
.v3-nav button{
  border:0;background:transparent;color:#53657a;border-radius:10px;
  padding:10px 12px;font-size:12px;font-weight:800;white-space:nowrap
}
.v3-nav button:hover{background:#eef6fc;color:var(--v3-blue)}
.v3-nav button.active{background:#e6f3fc;color:var(--v3-blue);box-shadow:inset 0 0 0 1px #cfe8f8}
.v3-user{display:flex;align-items:center;gap:10px;min-width:240px;justify-content:flex-end}
.v3-alert{position:relative;border:1px solid var(--v3-line);background:#fff;border-radius:11px;padding:9px 11px;color:var(--v3-navy)}
.v3-alert-count{position:absolute;right:-5px;top:-6px;background:#ed1c2e;color:#fff;border-radius:999px;min-width:19px;height:19px;display:grid;place-items:center;font-size:10px;font-weight:900}
.v3-avatar{width:39px;height:39px;border-radius:11px;background:linear-gradient(135deg,var(--v3-blue),#3346b7);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:900}
.v3-user-name{font-size:12px;font-weight:900;color:var(--v3-navy)}
.v3-user-role{font-size:10px;color:var(--v3-muted);margin-top:2px}
.v3-mobile-toggle{display:none;border:1px solid var(--v3-line);background:#fff;border-radius:10px;padding:9px 11px;color:var(--v3-navy)}
.v3-mobile-menu{display:none;position:fixed;top:72px;left:12px;right:12px;z-index:79;background:#fff;border:1px solid var(--v3-line);border-radius:15px;padding:10px;box-shadow:var(--v3-shadow)}
.v3-mobile-menu.open{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.v3-mobile-menu button{border:0;background:#f5f8fb;color:var(--v3-navy);border-radius:9px;padding:11px;text-align:left;font-size:12px;font-weight:800}

/* Encabezados y tarjetas */
.header{background:transparent!important;margin-bottom:20px!important}
.system-title{font-size:clamp(25px,3vw,36px)!important;letter-spacing:-.025em!important}
.system-subtitle{font-size:15px!important}
.panel,.kpi,.table-wrap{border-color:var(--v3-line)!important;box-shadow:var(--v3-shadow)!important}
.panel,.kpi{border-radius:17px!important}
.kpi{transition:transform .18s ease,box-shadow .18s ease}
.kpi:hover{transform:translateY(-2px);box-shadow:0 16px 38px rgba(19,54,88,.12)!important}
.kpi-icon{border-radius:13px!important}
.filters{position:sticky;top:84px;z-index:20;background:rgba(255,255,255,.96)!important;backdrop-filter:blur(12px)}
.req-table tbody tr:hover td{background:#f5faff!important}
.btn{transition:transform .15s ease,box-shadow .15s ease}.btn:hover{transform:translateY(-1px)}
.btn-primary{box-shadow:0 8px 18px rgba(8,119,201,.18)}

/* Firma discreta */
.v3-credit{position:fixed;right:18px;bottom:14px;z-index:30;background:rgba(255,255,255,.92);border:1px solid var(--v3-line);border-radius:999px;padding:7px 11px;font-size:10px;color:var(--v3-muted);box-shadow:0 6px 18px rgba(19,54,88,.08)}
.v3-credit strong{color:var(--v3-navy)}

@media(max-width:1120px){
  .v3-nav{display:none}.v3-mobile-toggle{display:block}.v3-brand{min-width:0}.v3-user{min-width:0}
}
@media(max-width:720px){
  .v3-topbar{height:64px;padding:0 12px}.main{padding:82px 12px 34px!important}
  .v3-brand-title{font-size:12px}.v3-brand-sub{display:none}.v3-brand-logo{width:36px;height:36px}
  .v3-user-copy{display:none}.v3-alert{padding:8px}.v3-credit{position:static;margin:15px auto;width:max-content}
  .v3-mobile-menu{top:64px}.kpis{grid-template-columns:1fr 1fr!important}.filters{top:72px}
}
@media(max-width:480px){.kpis{grid-template-columns:1fr!important}.v3-mobile-menu.open{grid-template-columns:1fr}}
</style>

<script>
(function(){
  const AUTHOR='Bayron Retamal González';

  function navItems(){
    const base=[
      ['dashboard','Panel Ejecutivo','◉'],
      ['requirements','Requerimientos','▣'],
      ['trace','Trazabilidad','◷'],
      ['alerts','Alertas','♢']
    ];
    if(typeof isManager==='function'&&isManager()){
      base.splice(2,0,['team','Equipo','♙']);
      base.push(['reports','Reportes','▥'],['indicators','Indicadores','⌁']);
    }
    if(current?.r==='Administrador')base.push(['userAdministration','Administración','⚙']);
    return base;
  }

  function activateNav(id){
    document.querySelectorAll('.v3-nav button,.v3-mobile-menu button').forEach(btn=>btn.classList.toggle('active',btn.dataset.section===id));
  }

  function go(id){
    const original=document.querySelector(`.nav button[onclick*="'${id}'"]`);
    if(id==='userAdministration'&&typeof window.show==='function'){window.show(id);}
    else if(typeof window.show==='function'){window.show(id,original||undefined);}
    activateNav(id);
    document.getElementById('v3MobileMenu')?.classList.remove('open');
  }
  window.v3Go=go;

  function renderNav(container){
    container.innerHTML=navItems().map(([id,label,icon])=>`<button data-section="${id}" onclick="v3Go('${id}')">${icon} ${label}</button>`).join('');
  }

  function installTopbar(){
    if(typeof current==='undefined'||!current||document.getElementById('v3Topbar'))return;
    const app=document.getElementById('app');if(!app)return;
    const bar=document.createElement('header');bar.id='v3Topbar';bar.className='v3-topbar';
    bar.innerHTML=`
      <div class="v3-brand">
        <img class="v3-brand-logo" src="https://gestordocumentalhsjd.ceropapel.cl/archivos/publico//logos/logo3.jpg" alt="SSMOCC">
        <div><div class="v3-brand-title">Gestión y Trazabilidad<br>para Compras Públicas</div><div class="v3-brand-sub">Departamento de Abastecimiento · SSMOCC</div></div>
      </div>
      <nav id="v3Nav" class="v3-nav"></nav>
      <div class="v3-user">
        <button class="v3-mobile-toggle" onclick="document.getElementById('v3MobileMenu').classList.toggle('open')">☰</button>
        <button class="v3-alert" onclick="v3Go('alerts')">🔔<span id="v3AlertCount" class="v3-alert-count">0</span></button>
        <div class="v3-avatar">${current.i}</div>
        <div class="v3-user-copy"><div class="v3-user-name">${current.n}</div><div class="v3-user-role">${current.r}</div></div>
      </div>`;
    app.prepend(bar);
    const mobile=document.createElement('div');mobile.id='v3MobileMenu';mobile.className='v3-mobile-menu';document.body.appendChild(mobile);
    renderNav(document.getElementById('v3Nav'));renderNav(mobile);
    const credit=document.createElement('div');credit.className='v3-credit';credit.innerHTML=`Diseñado y desarrollado por <strong>${AUTHOR}</strong>`;document.body.appendChild(credit);
    activateNav('dashboard');updateTopbar();
  }

  function updateTopbar(){
    const count=typeof visible==='function'?visible().filter(x=>x.alerts?.[current?.u]).length:0;
    const node=document.getElementById('v3AlertCount');if(node){node.textContent=count;node.style.display=count?'grid':'none'}
  }

  const originalLogin=window.login;
  window.login=function(){originalLogin();setTimeout(installTopbar,0);setTimeout(updateTopbar,20)};
  const originalRenderAll=window.renderAll;
  window.renderAll=function(){originalRenderAll();updateTopbar()};
  const originalShow=window.show;
  window.show=function(id,button){originalShow(id,button);activateNav(id)};
})();
</script>
