<style>
/* Estructura del menú lateral: navegación desplazable y pie sin superposición. */
.sidebar{
  display:flex !important;
  flex-direction:column !important;
  height:100vh !important;
  min-height:680px;
  overflow:hidden !important;
}
.sidebar-logo,.brand,.profile{flex:0 0 auto}
.sidebar .nav{
  flex:1 1 auto;
  min-height:0;
  overflow-y:auto;
  overflow-x:hidden;
  padding-right:4px;
  margin-bottom:10px;
  scrollbar-width:thin;
  scrollbar-color:rgba(255,255,255,.28) transparent;
}
.sidebar .nav::-webkit-scrollbar{width:5px}
.sidebar .nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.28);border-radius:99px}
.sidebar-foot{
  position:static !important;
  inset:auto !important;
  flex:0 0 auto;
  margin-top:auto;
  padding:12px 0 0 !important;
  border-top:1px solid rgba(255,255,255,.15) !important;
  background:transparent;
}
.sidebar-foot small{margin:0 0 5px !important;line-height:1.35}
.developer-credit{
  font-size:10px;
  line-height:1.35;
  color:rgba(255,255,255,.78);
  margin:0 0 9px;
  padding:0;
  border:0;
}
.developer-credit strong{display:block;color:#fff;font-size:11px;margin-top:2px}
.sidebar-foot .btn{margin-top:8px;padding:9px 12px}
.login-developer{margin-top:16px;padding-top:13px;border-top:1px solid #dfe6ee;text-align:center;color:#6f7e91;font-size:11px}.login-developer strong{color:#063c70}
.system-developer-badge{display:inline-flex;align-items:center;gap:7px;margin-top:10px;padding:7px 11px;border:1px solid #dfe6ee;border-radius:999px;background:#fff;color:#063c70;font-size:11px;font-weight:800;box-shadow:0 5px 14px rgba(18,55,88,.06)}
.system-toast{position:fixed;right:22px;bottom:22px;z-index:150;padding:12px 16px;border-radius:10px;background:#063c70;color:#fff;box-shadow:0 10px 28px rgba(0,0,0,.22);font-size:12px;font-weight:800}
.login{min-height:100dvh;min-height:100vh;padding:clamp(20px,5vh,48px) 20px;align-content:center;overflow:auto}
.login-card{margin:auto;max-height:calc(100vh - 40px);overflow:auto}
@media(max-height:760px){.login{align-content:start;padding-top:20px}.login-card{max-height:none}.official-logo{max-height:150px;object-fit:contain}.login h1{font-size:23px}.login p{margin-bottom:14px}.sidebar{min-height:620px}.sidebar-logo{max-height:132px;object-fit:contain}.brand{margin-bottom:10px}.profile{margin-bottom:9px}.nav button{padding:9px 11px;margin-bottom:3px}}
@media(max-width:800px){.sidebar{height:auto !important;min-height:0;overflow:visible !important}.sidebar .nav{overflow:visible}.sidebar-foot{margin-top:14px}}
</style>
<script>
(function(){
 const AUTHOR='Bayron Retamal González';
 function installIdentity(){
  const card=document.querySelector('.login-card');
  if(card&&!card.querySelector('.login-developer'))card.insertAdjacentHTML('beforeend',`<div class="login-developer">Diseño y desarrollo<br><strong>${AUTHOR}</strong></div>`);
  const foot=document.querySelector('.sidebar-foot');
  if(foot&&!foot.querySelector('.developer-credit'))foot.insertAdjacentHTML('afterbegin',`<div class="developer-credit">Desarrollado por<strong>${AUTHOR}</strong></div>`);
  const subtitle=document.querySelector('#dashboard .system-subtitle');
  if(subtitle&&!document.querySelector('.system-developer-badge'))subtitle.insertAdjacentHTML('afterend',`<div class="system-developer-badge">◈ Desarrollo interno · ${AUTHOR}</div>`);
 }
 function csvEscape(v){return `"${String(v??'').replaceAll('"','""')}"`}
 function downloadCsv(filename,headers,rows){const text=[headers,...rows].map(r=>r.map(csvEscape).join(';')).join('\n');const blob=new Blob(['\ufeff'+text],{type:'text/csv;charset=utf-8;'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url)}
 function toast(m){const n=document.createElement('div');n.className='system-toast';n.textContent=m;document.body.appendChild(n);setTimeout(()=>n.remove(),2600)}
 window.exportWorkloadCsv=function(){if(typeof isManager==='function'&&!isManager())return alert('Disponible solo para perfiles de gestión.');const rows=executives().map(u=>[u.n,req.filter(i=>i.exec===u.u).length,active(u.u).length,req.filter(i=>i.exec===u.u&&i.estado==='Pendiente').length,req.filter(i=>i.exec===u.u&&i.estado==='En ejecución').length,score(u.u),load(u.u).label]);downloadCsv(`carga_ejecutivos_${new Date().toISOString().slice(0,10)}.csv`,['Ejecutivo','Total','Activos','Pendientes','En ejecución','Puntaje','Carga'],rows);toast('Reporte de carga descargado.')};
 window.exportTraceCsv=function(){const data=typeof visible==='function'?visible():req;const rows=data.flatMap(i=>i.hist.map(e=>[`REQ-${String(i.id).padStart(3,'0')}`,i.t,name(i.exec),i.estado,i.prio,e.f,name(e.u),e.estado||i.estado,e.d]));downloadCsv(`trazabilidad_${new Date().toISOString().slice(0,10)}.csv`,['ID','Requerimiento','Responsable','Estado actual','Prioridad','Fecha evento','Usuario','Estado evento','Detalle'],rows);toast('Trazabilidad descargada.')};
 window.generateWeeklyReport=function(){if(typeof isManager==='function'&&!isManager())return alert('Disponible solo para perfiles de gestión.');const activeItems=req.filter(i=>i.estado!=='Terminado');const rows=executives().map(u=>`<tr><td>${u.n}</td><td>${active(u.u).length}</td><td>${score(u.u)}</td><td>${load(u.u).label}</td></tr>`).join('');const w=window.open('','_blank','width=1000,height=800');if(!w)return alert('Habilite las ventanas emergentes para generar el reporte.');w.document.write(`<!DOCTYPE html><html><head><meta charset="utf-8"><title>Reporte Ejecutivo</title><style>body{font-family:Arial;padding:28px;color:#132b49}h1,h2{color:#063c70}table{width:100%;border-collapse:collapse}th,td{border:1px solid #dfe6ee;padding:8px;text-align:left}th{background:#edf4f9}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.kpi{border:1px solid #dfe6ee;border-radius:9px;padding:12px}.kpi b{font-size:23px;display:block}@media print{body{padding:0}}</style></head><body><h1>Sistema de Gestión y Trazabilidad para Compras Públicas</h1><p>Departamento de Abastecimiento · SSMOCC</p><p>Generado por ${current?.n||'Sistema'} · ${new Date().toLocaleString('es-CL')}</p><div class="kpis"><div class="kpi">Activos<b>${activeItems.length}</b></div><div class="kpi">En ejecución<b>${activeItems.filter(x=>x.estado==='En ejecución').length}</b></div><div class="kpi">Vencidos<b>${activeItems.filter(x=>x.vencido).length}</b></div><div class="kpi">Terminados<b>${req.filter(x=>x.estado==='Terminado').length}</b></div></div><h2>Carga por ejecutivo</h2><table><thead><tr><th>Ejecutivo</th><th>Activos</th><th>Puntaje</th><th>Clasificación</th></tr></thead><tbody>${rows}</tbody></table><p style="margin-top:30px;font-size:11px;color:#6f7e91">Diseñado y desarrollado por ${AUTHOR}</p><script>setTimeout(()=>window.print(),400)<\/script></body></html>`);w.document.close()};
 const observer=new MutationObserver(installIdentity);observer.observe(document.body,{childList:true,subtree:true});document.addEventListener('DOMContentLoaded',installIdentity);installIdentity();
})();
</script>
