<style>
.executive-chart{width:100%;height:245px;display:block}.chart-legend{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:8px;font-size:10px;color:#66778b}.chart-legend span{display:flex;align-items:center;gap:5px}.chart-legend i{width:9px;height:9px;border-radius:3px;display:inline-block}.chart-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.chart-summary div{background:#f7f9fc;border:1px solid #e3eaf1;border-radius:9px;padding:8px;text-align:center}.chart-summary b{display:block;font-size:17px;color:#063c70}.chart-summary small{font-size:9px;color:#6f7e91}.chart-tooltip{position:fixed;z-index:300;pointer-events:none;background:#082f55;color:#fff;padding:7px 9px;border-radius:7px;font-size:10px;box-shadow:0 8px 22px rgba(0,0,0,.2);display:none}
</style>
<div id="chartTooltip" class="chart-tooltip"></div>
<script>
(function(){
 const palette={blue:'#0877c9',orange:'#ff9f1c',purple:'#805ad5',green:'#22a447',red:'#ed1c2e',gray:'#dfe6ee'};
 function stateData(){return [
  {label:'En ejecución',value:req.filter(x=>x.estado==='En ejecución').length,color:palette.blue},
  {label:'Pendientes',value:req.filter(x=>x.estado==='Pendiente').length,color:palette.orange},
  {label:'En espera',value:req.filter(x=>x.estado==='En espera').length,color:palette.purple},
  {label:'Terminados',value:req.filter(x=>x.estado==='Terminado').length,color:palette.green}
 ]}
 function donutSvg(data){const total=Math.max(1,data.reduce((a,b)=>a+b.value,0)),r=62,c=2*Math.PI*r;let offset=0;const circles=data.map(d=>{const len=c*d.value/total;const el=`<circle cx="100" cy="100" r="${r}" fill="none" stroke="${d.color}" stroke-width="28" stroke-dasharray="${len} ${c-len}" stroke-dashoffset="${-offset}" transform="rotate(-90 100 100)"/>`;offset+=len;return el}).join('');return `<svg class="executive-chart" viewBox="0 0 200 200" role="img">${circles}<circle cx="100" cy="100" r="43" fill="#fff"/><text x="100" y="94" text-anchor="middle" font-size="25" font-weight="900" fill="#063c70">${total}</text><text x="100" y="112" text-anchor="middle" font-size="9" fill="#6f7e91">TOTAL</text></svg><div class="chart-legend">${data.map(d=>`<span><i style="background:${d.color}"></i>${d.label}: ${d.value}</span>`).join('')}</div>`}
 function trendSvg(){const months=['Mar','Abr','May','Jun','Jul','Ago'];const created=[2,4,3,5,4,req.length];const done=[0,1,1,2,3,req.filter(x=>x.estado==='Terminado').length];const w=520,h=210,p=35,max=Math.max(...created,...done,1)+1;const point=(v,i)=>[p+i*(w-2*p)/(months.length-1),h-p-v*(h-2*p)/max];const path=a=>a.map((v,i)=>`${i?'L':'M'} ${point(v,i)[0]} ${point(v,i)[1]}`).join(' ');return `<svg class="executive-chart" viewBox="0 0 ${w} ${h}">${[0,1,2,3,4].map(i=>{const y=p+i*(h-2*p)/4;return `<line x1="${p}" y1="${y}" x2="${w-p}" y2="${y}" stroke="#e8eef4"/>`}).join('')}<path d="${path(created)}" fill="none" stroke="${palette.blue}" stroke-width="4" stroke-linecap="round"/><path d="${path(done)}" fill="none" stroke="${palette.green}" stroke-width="4" stroke-linecap="round"/>${created.map((v,i)=>{const [x,y]=point(v,i);return `<circle cx="${x}" cy="${y}" r="5" fill="${palette.blue}"/>`}).join('')}${done.map((v,i)=>{const [x,y]=point(v,i);return `<circle cx="${x}" cy="${y}" r="5" fill="${palette.green}"/>`}).join('')}${months.map((m,i)=>`<text x="${point(0,i)[0]}" y="${h-10}" text-anchor="middle" font-size="10" fill="#6f7e91">${m}</text>`).join('')}</svg><div class="chart-legend"><span><i style="background:${palette.blue}"></i>Creados</span><span><i style="background:${palette.green}"></i>Terminados</span></div>`}
 function loadBars(){const data=executives().map(u=>({name:u.n.split(' ').slice(0,2).join(' '),score:score(u.u)})).sort((a,b)=>b.score-a.score).slice(0,6);const max=Math.max(...data.map(x=>x.score),1);return `<div style="padding:8px 2px">${data.map(x=>`<div style="display:grid;grid-template-columns:145px 1fr 35px;gap:8px;align-items:center;margin:12px 0;font-size:10px"><b style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${x.name}</b><div style="height:10px;background:#edf1f5;border-radius:99px;overflow:hidden"><div style="height:100%;width:${x.score/max*100}%;background:${x.score>=25?palette.red:x.score>=16?palette.orange:x.score>=8?'#f2c94c':palette.green};border-radius:99px"></div></div><strong>${x.score}</strong></div>`).join('')}</div>`}
 function installCharts(){const boxes=document.querySelectorAll('#dashboard .grid3 .chart-box');if(boxes[0])boxes[0].innerHTML=donutSvg(stateData());if(boxes[1])boxes[1].innerHTML=trendSvg();const workload=document.querySelector('#dashboard .manager .chart-box');}
 function addLoadPanel(){if(document.getElementById('proLoadChart'))return;const grid=document.querySelector('#dashboard .grid3');if(!grid)return;const panel=document.createElement('div');panel.className='panel manager';panel.id='proLoadChart';panel.innerHTML=`<div class="panel-title"><h2>Carga ponderada del equipo</h2></div><div id="loadBars"></div>`;grid.insertAdjacentElement('afterend',panel);panel.classList.toggle('hidden',!isManager());document.getElementById('loadBars').innerHTML=loadBars()}
 function refresh(){installCharts();addLoadPanel();if(document.getElementById('loadBars'))document.getElementById('loadBars').innerHTML=loadBars()}
 const oldLogin=window.login;window.login=function(){oldLogin();setTimeout(refresh,40)};const oldRender=window.renderAll;window.renderAll=function(){oldRender();setTimeout(refresh,20)};const obs=new MutationObserver(()=>{if(current)refresh()});obs.observe(document.body,{childList:true,subtree:true});
})();
</script>
